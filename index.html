<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BRICK RUSH 99</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#fff0f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />

    <!-- 引入拆分的 CSS -->
    <link rel="stylesheet" href="./css/game.css" />
    <link rel="stylesheet" href="./css/menu.css" />
    <link rel="stylesheet" href="./css/lobby.css" />
    <link rel="stylesheet" href="./mod/chem.css" />

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  </head>
  <body>
    <div id="rotate-prompt">
      📱<br />請將設備轉為直向<br />以顯示完整對戰畫面
    </div>
    <div id="vbtn-solo-left" class="vbtn-solo"><div class="btn">◀</div></div>
    <div id="vbtn-solo-right" class="vbtn-solo"><div class="btn">▶</div></div>
    <div id="vbtn-p1-group" class="vbtn-group">
      <span class="vbtn-group-label" style="color: #d96c8e">1P</span>
      <div class="btn">◀</div>
      <div class="btn">▶</div>
    </div>
    <div id="vbtn-p2-group" class="vbtn-group">
      <span class="vbtn-group-label" style="color: #5fa8d3">2P</span>
      <div class="btn">◀</div>
      <div class="btn">▶</div>
    </div>

    <div id="wrap" style="width: 800px; height: 600px">
      <div id="overlay">
        <h1 id="title">BRICK RUSH 99</h1>
        <div id="loading">正在載入遊戲資源...</div>

        <div
          id="menu-btns"
          style="
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
          ">
          <div class="menu-group menu-group-top">
            <button class="menu-group-item" onclick="window.startGame(1)">
              🚀 單人冒險模式
            </button>
            <button class="menu-group-item" onclick="window.startGame(2)">
              ⚡ 雙人對戰 (限時 3 分鐘)
            </button>
          </div>
          <div class="menu-group menu-group-bottom">
            <button class="menu-group-item" onclick="window.createRoom()">
              👑 建立連線房間
            </button>
            <div class="menu-group-item">
              <label>玩家暱稱:</label
              ><input
                type="text"
                id="player-name-input"
                placeholder="輸入名稱"
                maxlength="10" />
            </div>
            <div class="menu-group-item split">
              <input
                type="text"
                id="room-code-input"
                placeholder="輸入代碼" /><button onclick="window.joinRoom()">
                🔗 連線加入
              </button>
            </div>
          </div>

          <!-- ★ 第三個區塊：遊戲設定 (合併單一區塊，中間分隔) -->
          <div
            class="menu-group"
            style="
              border-color: #c9b1e8;
              box-shadow: 0 8px 25px rgba(201, 177, 232, 0.25);
            ">
            <div
              class="menu-group-item split"
              style="cursor: default; padding: 0">
              <!-- 左側：起始關卡 (無邊框融合設計) -->
              <div
                style="
                  flex: 1;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  height: 100%;
                  border-right: 1px solid rgba(201, 177, 232, 0.5);
                ">
                <label
                  for="start-level"
                  style="
                    font-size: 16px;
                    font-weight: 900;
                    color: #5d576b;
                    cursor: pointer;
                    padding: 0 10px 0 20px;
                  "
                  >關卡</label
                >
                <input
                  type="number"
                  id="start-level"
                  value="1"
                  min="1"
                  max="999"
                  style="
                    width: 40px;
                    background: transparent;
                    border: none;
                    outline: none;
                    font-family: &quot;Orbitron&quot;, sans-serif;
                    font-size: 20px;
                    font-weight: 900;
                    color: #d96c8e;
                    text-align: center;
                    cursor: pointer;
                    padding: 0;
                  " />
              </div>

              <!-- 右側：化學 DLC 開關 -->
              <label
                style="
                  flex: 1;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  height: 100%;
                  font-size: 16px;
                  font-weight: 900;
                  color: #5d576b;
                  cursor: pointer;
                ">
                化學 DLC
                <div
                  class="toggle-switch"
                  style="margin-left: 12px; transform: scale(0.9)">
                  <input type="checkbox" id="enable-dlc" checked />
                  <span class="slider"></span>
                </div>
              </label>
            </div>
          </div>
        </div>
        <div
          id="lobby-screen"
          style="
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            z-index: 200;
          ">
          <!-- ★ 將代碼與模式並排，用分隔線隔開，並加上微透明背景襯托 -->
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 15px;
              margin-bottom: 15px;
            ">
            <h2
              style="
                color: #dda15e;
                font-size: 28px;
                font-weight: 900;
                margin: 0;
              ">
              <span style="font-family: Noto Sans TC">房間代碼: </span
              ><span
                id="lobby-code"
                style="
                  color: #5d576b;
                  font-family: &quot;Orbitron&quot;;
                "></span>
            </h2>
            <div
              style="
                width: 2px;
                height: 28px;
                background: rgba(201, 177, 232, 0.6);
              "></div>
            <div
              id="lobby-dlc-status"
              style="
                font-size: 20px;
                font-weight: 900;
                color: #a8dd5e;
                margin-top: 2px;
              ">
              🧪 化學擴展 (DLC)
            </div>
          </div>

          <div id="player-list"></div>

          <div style="display: flex; gap: 10px; margin-top: 10px">
            <button
              id="btn-lobby-shop"
              class="menu-item-macaron macaron-yellow"
              style="width: 155px"
              onclick="
                window.setChemistryMode(2);
                window.openChemistryShop('配方商店', 0);
              ">
              🛒 進入商店
            </button>
            <button
              id="btn-ready"
              class="menu-item-macaron macaron-pink"
              style="width: 155px"
              onclick="window.toggleReady()">
              準備完成
            </button>
            <!-- ★ 格式比照上面按鈕，換成 macaron-blue 樣式，並改為「離開」 -->
            <button
              class="menu-item-macaron macaron-blue"
              style="width: 150px"
              onclick="window.location.reload()">
              離開
            </button>
          </div>
        </div>

        <div id="bottom-status-bar">
          <div id="cheat-info">
            操作 | 單人: 左右鍵 · 雙人 1P: A/D · 2P: 左右鍵
          </div>
          <div id="status-right-group">
            <div id="room-status"></div>
            <div id="lobby-countdown">10s...</div>
          </div>
        </div>
      </div>

      <!-- ★ 新增：單人過關商店選擇畫面 (放在 #status 上方) -->
      <div
        id="level-clear-overlay"
        style="
          display: none;
          position: absolute;
          inset: 0;
          background: rgba(255, 255, 255, 0.85);
          backdrop-filter: blur(10px);
          z-index: 300;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          border-radius: 10px;
        ">
        <h1
          style="
            color: #dda15e;
            font-family: &quot;Orbitron&quot;, sans-serif;
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 30px;
          ">
          STAGE CLEAR!
        </h1>
        <div style="display: flex; gap: 20px">
          <button
            class="btn"
            style="min-width: 180px; border-color: #f6d98b"
            onclick="window.enterShopFromLevelClear()">
            🛒 進入商店
          </button>
          <button
            class="btn"
            style="min-width: 180px; border-color: #9dd9e8"
            onclick="window.proceedToNextLevel()">
            ▶ 下一關
          </button>
        </div>
      </div>

      <div id="status">
        <div class="stat-card" id="p1-card">
          <div style="display: flex; gap: 2px; align-items: center">
            <span
              class="stat-label"
              style="color: #dda15e; font-size: 16px"
              id="p1-rank"></span
            ><span class="stat-label" id="p1-label" style="color: #d96c8e"
              >1P <span class="stat-value" id="p1-score">0</span></span
            >
          </div>
          <div class="score-bar">
            <div
              id="p1-width-bar"
              class="score-fill"
              style="background: #f6a6c1; width: 100%"></div>
          </div>
          <div class="energy-bar" id="p1-energy-wrap">
            <div
              id="p1-energy-bar"
              class="energy-fill"
              style="
                background: linear-gradient(90deg, #f6a6c1, #c9b1e8);
                width: 0%;
              "></div>
          </div>
          <div id="p1-lives" class="lives-display" style="display: none"></div>
        </div>
        <div
          class="stat-card center-card"
          style="
            background: rgba(255, 255, 255, 0.75);
            box-shadow: 0 4px 15px rgba(246, 166, 193, 0.2);
          ">
          <div
            style="display: flex; flex-direction: column; align-items: center"
            id="timer-container">
            <span class="stat-label" style="color: #dda15e">TIME</span
            ><span id="timer-txt" class="stat-value">03:00</span>
          </div>
          <div
            style="
              width: 1px;
              height: 40px;
              background: rgba(246, 166, 193, 0.5);
            "></div>
          <div
            style="display: flex; flex-direction: column; align-items: center;">
            <span class="stat-label" style="color: #7a728a">LEVEL</span
            ><span id="level-txt" class="stat-value" style="color: #f46494">1</span>
          </div>
        </div>
        <div class="stat-card" id="p2-card">
          <span class="stat-label" style="color: #5fa8d3"
            >2P <span class="stat-value" id="p2-score">0</span></span
          >
          <div class="score-bar">
            <div
              id="p2-width-bar"
              class="score-fill"
              style="background: #9dd9e8; width: 100%"></div>
          </div>
          <div class="energy-bar" id="p2-energy-wrap">
            <div
              id="p2-energy-bar"
              class="energy-fill"
              style="
                background: linear-gradient(90deg, #9dd9e8, #a9b8e8);
                width: 0%;
              "></div>
          </div>
        </div>
      </div>

      <canvas id="game" width="800" height="600"></canvas>
      <!-- ★ 化學 DLC HTML 狀態列 (疊加於 Canvas 之上) -->
      <div
        id="chem-bottom-hud"
        style="
          display: none;
          position: absolute;
          bottom: 0px;
          left: 0px;
          width: 100%;
          height: 28px;
          background: rgba(255, 255, 255, 0.85);
          z-index: 50;
          justify-content: space-between;
          align-items: center;
          padding: 0 20px 7px 20px;
          box-sizing: border-box;
          pointer-events: none;
          font-size: 13px;
          border-radius: 0 0 10px 10px;
        ">
        <div id="hud-1p"></div>
        <div id="hud-2p" style="text-align: right"></div>
      </div>
      <div id="online-opponents-left" class="side-opponents"></div>
      <div id="online-opponents-right" class="side-opponents"></div>
      <div id="online-opponents-bottom" class="bottom-opponents"></div>
      <div id="online-blind"></div>
      <div id="online-attack-status"></div>
    </div>

    <!-- 引入模組化主程式 -->
    <script type="module">
      import { loadAudio } from "./js/audio.js";
      // 這裡新增了 resetMatchState 的引入
      import {
        loadImages,
        startGameGlobal,
        initGlobalBindings,
        onlineMode,
        onlinePlayers,
        p1,
        myPlayerId,
        resetMatchState,
        clearAttackPending,
      } from "./js/game.js";
      import { setupVirtualControls, resizeGame } from "./js/ui.js";
      // 這裡新增了 socket 的引入
      import {
        setupSocketListeners,
        createRoom,
        joinRoom,
        toggleReady,
        socket,
        updateReadyButton,
      } from "./js/socket.js";
      import { onlineRenderPlayers } from "./js/lobby.js";
      import { showOnlineMatchOver } from "./js/game.js";

      import { initChemistrySystem } from "./mod/chemistry.js";

      // 綁定全域函式供 HTML onclick 使用
      window.startGame = (mode) =>
        startGameGlobal(mode, document.getElementById("game"));
      window.createRoom = createRoom;
      window.joinRoom = joinRoom;
      window.toggleReady = toggleReady;
      window.backToMainMenu = () => {
        document.getElementById("title").innerHTML = "BRICK RUSH 99";
        document.getElementById("menu-btns").style.display = "flex";
        document.getElementById("bottom-status-bar").style.display = "flex";
      };

      // ★ 修正：加入重置變數與通知伺服器的邏輯 ★
      window.returnToLobby = () => {
        document.getElementById("online-attack-status").style.display = "none";
        document.getElementById("title").innerHTML = "BRICK RUSH 99";
        document.getElementById("lobby-screen").style.display = "flex";
        document.getElementById("room-status").style.display = "block";
        document.getElementById("bottom-status-bar").style.display = "flex";

        resetMatchState();
        if (socket && socket.connected) {
          socket.emit("restartOnlineGame");
        }
      };

      // 初始化資源與綁定事件
      Promise.all([loadImages(), loadAudio(), initChemistrySystem()])
        .then(() => {
          document.getElementById("loading").style.display = "none";
          document.getElementById("menu-btns").style.display = "flex";

          setupVirtualControls();
          initGlobalBindings();

          setupSocketListeners({
            showLobby: (code) => {
              document.getElementById("menu-btns").style.display = "none";
              document.getElementById("lobby-screen").style.display = "flex";
              document.getElementById("lobby-code").innerText = code;
              setChemistryMode(2);

              // ★ 進大廳時先讀取一次本地開關狀態，避免初始顯示錯誤
              const isDlc = document.getElementById("enable-dlc").checked;
              const dlcStatus = document.getElementById("lobby-dlc-status");
              if (dlcStatus) {
                dlcStatus.innerText =
                  isDlc ? "🧪 化學擴展 (DLC)" : "🎮 一般對戰";
                dlcStatus.style.color = isDlc ? "#DDA15E" : "#7A728A";
              }
              if (typeof updateReadyButton === "function") updateReadyButton(); // 同步商店按鈕
            },
            onLobbyState: (state) => {
              // ★ 新增：房主負責廣播 DLC 狀態，其他玩家禁用勾選框
              const me = (state?.players || []).find((p) => p.id === socket.id);
              const isHost = me?.host;
              const dlcCb = document.getElementById("enable-dlc");
              if (dlcCb) {
                if (isHost) {
                  dlcCb.parentElement.style.pointerEvents = "auto";
                  dlcCb.parentElement.style.opacity = "1";
                  socket.emit("playerState", {
                    isLobbySync: true,
                    dlc: dlcCb.checked,
                  });
                } else {
                  dlcCb.parentElement.style.pointerEvents = "none";
                  dlcCb.parentElement.style.opacity = "0.5";
                }
              }
            },
            onOnlineState: (state) => {
              if (state?.isLobbySync !== undefined) {
                const dlcCb = document.getElementById("enable-dlc");
                if (dlcCb) dlcCb.checked = state.dlc;

                const dlcStatus = document.getElementById("lobby-dlc-status");
                if (dlcStatus) {
                  dlcStatus.innerText =
                    state.dlc ? "🧪 化學擴展 (DLC)" : "🎮 一般對戰";
                  dlcStatus.style.color = state.dlc ? "#DDA15E" : "#7A728A";
                }

                const lobbyShop = document.getElementById("btn-lobby-shop");
                if (lobbyShop) {
                  lobbyShop.style.display = state.dlc ? "flex" : "none";
                }

                if (typeof updateReadyButton === "function") {
                  updateReadyButton();
                }

                return;
              }
              if (!onlineMode || !state?.id || state.id === myPlayerId) return;
              onlinePlayers[state.id] = {
                ...(onlinePlayers[state.id] || {}),
                ...state,
                alive: state.alive !== false,
              };
            },
            onAttackAccepted: () => {
              if (p1) p1.energy = 0; // 新增這行：攻擊成功後將本機能量歸零
              document
                .getElementById("p1-energy-wrap")
                ?.classList.remove("online-energy-ready");
              clearAttackPending(); // 新增這行：解除發送鎖定，允許下一次攻擊
            },
            onAttackRejected: (data) => {
              if (p1 && Number.isFinite(Number(data?.energy))) {
                p1.energy = Math.min(p1.maxEnergy, Number(data.energy));
                document
                  .getElementById("p1-energy-wrap")
                  ?.classList.toggle(
                    "online-energy-ready",
                    p1.energy >= p1.maxEnergy,
                  );
              }
              clearAttackPending(); // 新增這行：解除發送鎖定
            },
            onPlayerEliminated: (data) => {
              if (data?.id && onlinePlayers[data.id]) {
                onlinePlayers[data.id].alive = false;
                onlinePlayers[data.id].rank =
                  data.rank || onlinePlayers[data.id].rank;
              }
            },
          });

          setTimeout(resizeGame, 100);
        })
        .catch((err) => {
          document.getElementById("loading").textContent =
            "載入失敗: " + (err && err.message ? err.message : err);
          document.getElementById("loading").style.color = "#ff3333";
        });
    </script>
  </body>
</html>
