        <div class="trophy">🤝</div>
        <div class="victory-title" style="color:#fff">平手！</div>
        <div class="winner-score">${p1.score} : ${p2.score}</div>
      </div>`;
          }
        } else {
          msg = `<div class="victory-screen">
      <div class="winner-score" style="color:#f472b6; font-size:48px;">最終得分: ${p1.score}</div>
      <div class="vs-score">剩餘生命: ${Math.max(0, p1.lives)}</div>
    </div>`;
        }
        titleEl.innerHTML = msg;
        menuBtns.style.display = "flex";
        overlay.style.display = "flex";
        cv.style.display = "none";
        document.getElementById("status").style.display = "none";
      }

      function sfx(name) {
        const a = loaded[name];
        if (!a) return;
        a.currentTime = 0;
        a.play().catch(() => {});
      }
      function unlockAudio() {
        for (const k of ["hit", "brk", "bounce"]) {
          const a = loaded[k];
          if (a) {
            a.play()
              .then(() => {
                a.pause();
                a.currentTime = 0;
              })
              .catch(() => {});
          }
        }
        window.removeEventListener("click", unlockAudio);
        window.removeEventListener("keydown", unlockAudio);
      }
      window.addEventListener("click", unlockAudio);
      window.addEventListener("keydown", unlockAudio);

      loadAll()
        .then(() => {
          loadingTxt.style.display = "none";
          menuBtns.style.display = "flex";
          const touchCapable =
            "ontouchstart" in window || navigator.maxTouchPoints > 0;
          const coarsePointer =
            window.matchMedia
            && window.matchMedia("(any-pointer: coarse)").matches;
          const noHover =
            window.matchMedia && window.matchMedia("(any-hover: none)").matches;
          if (touchCapable && coarsePointer && noHover) {
            showVirtual = true;
          }
          updateVirtualButtonsVisibility();
        })
        .catch((err) => {
          loadingTxt.textContent =
            "載入失敗: " + (err && err.message ? err.message : err);
          loadingTxt.style.color = "#ff3333";
        });

      // ==========================================
      // 完美的等比例縮放系統 (RWD) - 支援直式上方雙排佈局
      // ==========================================
      function resizeGame() {
        const wrap = document.getElementById("wrap");
        if (!wrap) return;

        const w = window.innerWidth;
        const h = window.innerHeight;

        // 偵測是否為直式螢幕 (高度大於寬度)
        const isPortrait = h > w;

        // 判斷目前是否處於連線對戰模式
        const isOnline = document.body.classList.contains("online-battle-mode");

        // 橫向且為連線模式時，加寬基準寬度到 1200 (包容左右面板)，否則維持 840
        const baseW = !isPortrait && isOnline ? 1200 : 840;

        // 判斷目前是否處於連線對戰模式
        const isOnline = document.body.classList.contains("online-battle-mode");

        // 只有在「直式」且「連線模式」下，才需要加大高度需求 (1150)，否則維持標準比例 (750)
        const baseH = isPortrait && isOnline ? 1150 : 750;

        // 取得寬高最小的縮放比例
        let scale = Math.min(w / baseW, h / baseH);

        // 限制最大放大倍率為 1.1
        if (scale > 1.1) scale = 1.1;

        wrap.style.transform = `scale(${scale})`;
        wrap.style.transformOrigin = "center center";
      }
      // 監聽視窗變更與設備翻轉
      window.addEventListener("resize", resizeGame);
      window.addEventListener("orientationchange", resizeGame);
      // 稍微延遲執行，確保所有字體與元素都載入完成再縮放
      setTimeout(resizeGame, 100);

      // ==========================================
      // 網路連線大廳邏輯
      // v2：完整 Lobby State / 8 人房間 / Ready / 倒數
      // ==========================================
      // 若網頁與 server 在同一台機器，使用目前網頁的 hostname。
      // 這樣手機/平板透過區網 IP 開啟網頁時，不會錯誤連到「手機自己的 localhost」。
      const socket = io("https://bm-server-90fs.onrender.com", {
        transports: ["websocket", "polling"],
        reconnection: true,
        reconnectionAttempts: Infinity,
        timeout: 8000,
      });

      let isReady = false;
      let currentRoomCode = null;
      let lobbyState = null;

      const menuBtnsEl = document.getElementById("menu-btns");
      const lobbyEl = document.getElementById("lobby-screen");
      const lobbyCodeEl = document.getElementById("lobby-code");
      const playerListEl = document.getElementById("player-list");
      const readyBtnEl = document.getElementById("btn-ready");
      const countdownEl = document.getElementById("lobby-countdown");
      const roomStatusEl = document.getElementById("room-status");

      function setRoomStatus(text, type = "info") {
        if (!roomStatusEl) return;
        roomStatusEl.style.display = text ? "block" : "none";
        roomStatusEl.innerText = text || "";
        roomStatusEl.style.color =
          type === "error" ? "#fb7185"
          : type === "success" ? "#34d399"
          : "#fde047";
      }

      function resetLobbyUI() {
        isReady = false;
        currentRoomCode = null;
        lobbyState = null;
        if (menuBtnsEl) menuBtnsEl.style.display = "flex";
        if (lobbyEl) lobbyEl.style.display = "none";
        if (playerListEl) playerListEl.innerHTML = "";
        if (lobbyCodeEl) lobbyCodeEl.innerText = "";
        if (countdownEl) countdownEl.style.display = "none";
        if (readyBtnEl) {
          readyBtnEl.innerText = "準備完成";
          readyBtnEl.className = "menu-item-macaron macaron-pink";
        }
      }

      function showLobby(code) {
        currentRoomCode = String(code || "").toUpperCase();
        if (menuBtnsEl) menuBtnsEl.style.display = "none";
        if (lobbyEl) lobbyEl.style.display = "flex";
        if (lobbyCodeEl) lobbyCodeEl.innerText = currentRoomCode;
        if (countdownEl) countdownEl.style.display = "none";
        setRoomStatus("已連線，正在等待其他玩家…", "success");
        renderLobbyPlayers(lobbyState?.players || []);
      }

      // 修改 createRoom 函式
      function createRoom() {
        if (!socket.connected) {
          setRoomStatus("尚未連線到遊戲伺服器，請稍候…", "error");
          return;
        }
        // --- 新增這兩行來抓取名稱並傳送 ---
        const name = document.getElementById("player-name-input").value.trim();
        if (name) socket.emit("setPlayerName", name);
        // --------------------------------

        setRoomStatus("正在建立房間…");
        socket.emit("createRoom");
      }

      // 修改 joinRoom 函式
      function joinRoom() {
        const input = document.getElementById("room-code-input");
        const code = (input?.value || "").trim().toUpperCase();

        // --- 新增這一行來抓取名稱 ---
        const name = document.getElementById("player-name-input").value.trim();

        if (!code) {
          alert("請輸入房間代碼");
          input?.focus();
          return;
        }
        if (!socket.connected) {
          setRoomStatus("尚未連線到遊戲伺服器，請稍候…", "error");
          return;
        }

        // --- 新增這一行來傳送名稱 ---
        if (name) socket.emit("setPlayerName", name);

        setRoomStatus(`正在加入房間 ${code}…`);
        socket.emit("joinRoom", code);
      }

      function updateReadyButton() {
        if (!readyBtnEl) return;
        readyBtnEl.innerText = isReady ? "取消準備" : "準備完成";
        readyBtnEl.className =
          isReady ?
            "menu-item-macaron macaron-blue"
          : "menu-item-macaron macaron-pink";
      }

      function toggleReady() {
        if (!currentRoomCode) {
          setRoomStatus("尚未進入房間", "error");
          return;
        }
        socket.emit("toggleReady");
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderLobbyPlayers(players) {
        if (!playerListEl) return;
        const list =
          Array.isArray(players) ? players : Object.values(players || {});

        // 沒人時顯示置中提示
        if (!list.length) {
          playerListEl.innerHTML =
            '<div style="grid-column: 1 / -1; text-align:center; color:#94a3b8; padding: 20px;">等待玩家加入…</div>';
          return;
        }

        // 渲染為網格項目
        playerListEl.innerHTML = list
          .map((p, index) => {
            const me = p.id === socket.id;
            const host = p.host ? "👑" : "";
            const name = escapeHtml(p.name || `玩家 ${index + 1}`);
            const statusColor = p.ready ? "#34d399" : "#94a3b8";
            const statusIcon = p.ready ? "✔" : "⋯";

            return `
      <div class="lobby-player-item" style="border-color: ${me ? "#fde047" : "rgba(255,255,255,.1)"}; box-shadow: ${me ? "0 0 8px rgba(253,224,71,0.3)" : "none"};">
        <span style="font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:110px;">
          ${host} ${name}
        </span>
        <span style="color:${statusColor}; font-weight:900; margin-left:8px; flex-shrink:0;">
          ${statusIcon}
        </span>
      </div>`;
          })
          .join("");

        const readyCount = list.filter((p) => p.ready).length;
        const countText = `${list.length}/99 人 ｜ ${readyCount}/${list.length} 已準備`;
        if (roomStatusEl && lobbyState?.status === "waiting") {
          setRoomStatus(countText, "info");
        }
      }

      socket.on("connect", () => {
        setRoomStatus("伺服器已連線", "success");
        console.log("Lobby socket connected:", socket.id);
      });

      socket.on("disconnect", (reason) => {
        if (currentRoomCode) {
          setRoomStatus(`與伺服器斷線（${reason}），正在重新連線…`, "error");
        }
        console.warn("Lobby socket disconnected:", reason);
      });

      socket.on("connect_error", (err) => {
        console.error("Lobby socket connection error:", err);
        if (!currentRoomCode) {
          setRoomStatus("無法連線到多人遊戲伺服器（Port 3000）", "error");
        }
      });

      // 建立/加入房間成功：先顯示 Lobby，再等待 lobbyState。
      socket.on("roomCreated", (payload) => {
        const code = typeof payload === "string" ? payload : payload?.code;
        showLobby(code);
      });

      socket.on("roomJoined", (payload) => {
        const code = typeof payload === "string" ? payload : payload?.code;
        showLobby(code);
      });

      socket.on("lobbyState", (state) => {
        lobbyState = state || {};

        // ✅ 如果正在顯示結算畫面，就不要強制切回大廳畫面 (解決殘留的核心)
        if (!onlineMatchFinished) {
          if (state?.code) {
            currentRoomCode = state.code;
            if (lobbyCodeEl) lobbyCodeEl.innerText = state.code;
            if (menuBtnsEl) menuBtnsEl.style.display = "none";
            if (lobbyEl) lobbyEl.style.display = "flex";
          }
          if (countdownEl && state?.status !== "countdown") {
            countdownEl.style.display = "none";
          }
          if (state?.status === "countdown" && state.countdown > 0) {
            countdownEl.style.display = "block";
            countdownEl.innerText = `🔥 遊戲將在 ${state.countdown} 秒後開始... 🔥`;
          }
        }

        const me = (state?.players || []).find((p) => p.id === socket.id);
        isReady = !!me?.ready;
        updateReadyButton();
        renderLobbyPlayers(state?.players || []);
      });

      // 舊版 roomUpdate 也保留相容性。
      socket.on("roomUpdate", (playersObj) => {
        const players =
          Array.isArray(playersObj) ? playersObj : (
            Object.values(playersObj || {})
          );
        renderLobbyPlayers(players);
        const me = players.find((p) => p.id === socket.id);
        if (me) {
          isReady = !!me.ready;
          updateReadyButton();
        }
      });

      socket.on("countdown", (time) => {
        if (!countdownEl) return;
        countdownEl.style.display = "block";
        countdownEl.innerText = `🔥 遊戲將在 ${time} 秒後開始... 🔥`;
      });

      socket.on("cancelCountdown", (message) => {
        if (countdownEl) countdownEl.style.display = "none";
        if (message) setRoomStatus(message, "info");
      });

      // Lobby 開始後進入獨立 Canvas + 遠端干擾模式。
      socket.on("gameStart", (state) => {
        if (lobbyEl) lobbyEl.style.display = "none";
        if (countdownEl) countdownEl.style.display = "none";
        if (menuBtnsEl) menuBtnsEl.style.display = "none";
        console.log("Online game start:", state);
        startOnlineGame(state);
      });

      socket.on("onlineState", (state) => {
        if (!onlineMode || !state?.id || state.id === myPlayerId) return;
        onlinePlayers[state.id] = {
          ...(onlinePlayers[state.id] || {}),
          ...state,
          alive: state.alive !== false,
        };
        onlineRenderPlayers();
      });
      socket.on("playerAttacked", (data) => onlineReceiveAttack(data));
      socket.on("onlineAttackAccepted", (data) => {
        onlineAttackPending = false;
        if (p1) p1.energy = 0;
        p1EnergyWrapEl?.classList.remove("online-energy-ready");
        if (data?.targetName)
          onlineShowStatus(`⚡ 攻擊 ${escapeHtml(data.targetName)}！`, 1000);
      });
      socket.on("onlineAttackRejected", (data) => {
        onlineAttackPending = false;
        if (p1 && Number.isFinite(Number(data?.energy))) {
          p1.energy = Math.min(p1.maxEnergy, Number(data.energy));
        }
        p1EnergyWrapEl?.classList.toggle(
          "online-energy-ready",
          !!p1 && p1.energy >= p1.maxEnergy,
        );
      });
      socket.on("onlineMatchOver", (result) => showOnlineMatchOver(result));
      socket.on("playerEliminated", (data) => {
        if (!data?.id) return;
        if (onlinePlayers[data.id]) {
          onlinePlayers[data.id].alive = false;
          onlinePlayers[data.id].rank =
            data.rank || onlinePlayers[data.id].rank;
        }
        onlineRenderPlayers();
      });

      socket.on("lobbyError", (message) => {
        console.error("Lobby error:", message);
        setRoomStatus(message || "多人遊戲發生錯誤", "error");
        alert(message || "多人遊戲發生錯誤");
      });

      // server.js 實際送出的錯誤事件是 "roomError"（建房 / 加入房間 / 房間已滿 /
      // 房間已開始等狀況都用這個名稱）。之前前端只監聽了 "lobbyError"，
      // 導致加入失敗時畫面卡在「正在加入房間 XXXX…」，沒有任何回饋。
      socket.on("roomError", (message) => {
        console.error("Room error:", message);
        setRoomStatus(message || "加入房間失敗", "error");
        alert(message || "加入房間失敗");
      });

      // 相容舊 server 的 error event，但不再依賴它。
      socket.on("error", (message) => {
        console.error("Socket error:", message);
        if (message) {
          setRoomStatus(String(message), "error");
        }
      });
    </script>
  </body>
</html>
